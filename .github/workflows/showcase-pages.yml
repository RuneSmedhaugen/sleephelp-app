name: Build REST showcase for GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'sleepapp/**'
      - '.github/workflows/showcase-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve Flutter packages
        working-directory: sleepapp
        run: flutter pub get
      - name: Build browser demo without bundled sound files
        working-directory: sleepapp
        run: ./tool/build_web_demo.ps1
        shell: pwsh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sleepapp/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
