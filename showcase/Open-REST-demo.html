<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Open the REST demo</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #090b10; color: #e2deeb;
      }
      main {
        width: min(100% - 32px, 620px); padding: 48px 36px 40px;
        display: grid; justify-items: center; text-align: center;
        border: 1px solid #79748d; border-radius: 28px;
        background: radial-gradient(ellipse at 50% 0%, #242137 0%, #11131d 50%, #090b10 100%);
      }
      h1 { margin: 0; font: 300 42px/1.1 Arial, sans-serif; letter-spacing: .34em; padding-left: .34em; }
      p { margin: 14px 0 24px; color: #bcb7c9; font: italic 22px Georgia, serif; }
      .open-demo {
        display: inline-block; padding: 18px 30px; border-radius: 14px;
        background: #8068d9; color: white; text-decoration: none;
        font-size: 21px; font-weight: bold;
      }
      .instructions { margin: 24px 0 12px; color: #d4d0dc; font-size: 17px; }
      img { display: block; width: min(65vw, 270px); height: auto; border-radius: 8px; }
      .qr-label { margin: 10px 0 0; color: #d4d0dc; font-size: 16px; }
      small { margin-top: 18px; color: #9393a2; font-size: 12px; }
      @media print {
        @page { size: A4 portrait; margin: 15mm; }
        :root { color-scheme: light; }
        body { min-height: auto; background: white; color: #16151b; }
        main { width: 100%; border-color: #bbb; background: white; }
        p, .instructions, .qr-label, small { color: #444; }
        .open-demo { border: 1px solid #777; background: white; color: #16151b; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>R.E.S.T.</h1>
      <p>Find your quieter night.</p>
      <a class="open-demo" href="https://runesmedhaugen.github.io/sleephelp-app/">Open the REST demo</a>
      <div class="instructions">On a phone or tablet? Open your camera and scan this code:</div>
      <img src="QR-code-for-opening-on-a-phone.png" alt="Scan this QR code with your phone camera to open the REST demo">
      <div class="qr-label">QR code for opening on a phone or tablet</div>
      <small>No installation needed · Demo sounds are silent</small>
    </main>
  </body>
</html>
